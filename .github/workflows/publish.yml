# Publish @supersuit/suggest-a-change to npm through OIDC trusted publishing.
#
# WHY. Publishing by hand needs a one-time password in a browser on every release, which puts a human
# round trip in front of every fix reaching the apps that consume this package. npm is also restricting
# tokens that bypass 2FA, so a long-lived automation token in a secret would work today and stop working
# on a date somebody else picked.
#
# HOW THE TRUST WORKS. There is no token here and no NODE_AUTH_TOKEN, deliberately. GitHub mints a
# short-lived OIDC identity for this workflow, npm verifies it against the trusted publisher configured on
# the package, and the publish is authorised by WHO ran it rather than by a secret anyone holding it could
# use. The trusted-publisher record on npm names this repository AND this filename, so renaming this file
# breaks publishing until the record is updated. That is the intended behaviour rather than a trap.
#
# HOW TO RELEASE. Bump the version in package.json, add the CHANGELOG entry, commit (with the lockfile),
# then:
#     git tag v0.1.0 && git push origin v0.1.0
# The tag is the trigger. The version guard below refuses a tag that disagrees with package.json, because
# a mismatch publishes a version nobody wrote a changelog for.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and stop before publishing"
        type: boolean
        default: true

permissions:
  contents: read
  # The one permission OIDC needs. Without it the publish fails with an auth error that
  # does not mention OIDC at all.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm checks the environment claim inside the OIDC token, so a trusted-publisher record that NAMES an
    # environment the job does not declare fails as ENEEDAUTH, with nothing said about environments. This
    # package's record names none (created with
    #     npm trust github @supersuit/suggest-a-change --file publish.yml \
    #       --repo SupersuitUp/suggest-a-change --allow-publish --allow-stage-publish
    # and `npm trust list` shows no environment), so any value here passes. If a record is ever given an
    # environment, this line must change to match it in the same sitting.
    #
    # The FIRST publish of a new package cannot go through this workflow: npm attaches a trusted publisher
    # to an existing package, so 0.1.0 is published by hand (web 2FA) and the record created right after
    # with the line above. Every release since is a tag push.
    environment: blank
    steps:
      - uses: actions/checkout@v5

      # NO `registry-url` HERE, AND THAT IS THE WHOLE TRICK.
      #
      # With OIDC, setting `registry-url` is the thing that breaks the publish. setup-node responds to it by
      # writing an .npmrc with an _authToken line and exporting NODE_AUTH_TOKEN as a placeholder. npm finds
      # a credential already configured, never attempts the OIDC exchange, sends the placeholder, and the
      # registry rejects it. The rejection is a 404 rather than a 401 (npm answers an unauthenticated PUT
      # with "not found" so private names cannot be probed), so the failure reads as "the package does not
      # exist" and says nothing about auth.
      #
      # Omitting it leaves npm with no configured credential, which is the state that makes it perform the
      # OIDC exchange. The default registry is already registry.npmjs.org.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # PINNED TO 11.x, NOT `npm@latest`. OIDC trusted publishing landed in npm 11.5.1, and a newer major
      # once skipped the exchange entirely and went straight to ENEEDAUTH. Raise this deliberately, after
      # checking that the new major still does the exchange, rather than by floating it.
      - name: Pin npm to a version that performs the OIDC exchange
        run: |
          npm install -g npm@11
          npm --version

      # The exchange needs these two, injected by GitHub only when `id-token: write` is set
      # above. Asserting them here turns a silent auth failure at the end of a five-minute
      # run into an immediate, named one.
      - name: Assert the OIDC identity is available
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "No OIDC identity available to this job."
            echo 'The workflow needs `permissions: id-token: write`, and a fork PR never gets one.'
            exit 1
          fi
          echo "OIDC identity present"

      # The package ships a built tree (dist/), so it is installed from the lockfile, checked in full
      # (typecheck, tests, build, and the node tests that assert every export target exists) and built
      # BEFORE it is published, never after. `npm publish` ships whatever dist/ holds at that moment.
      - run: npm ci
      - run: npm run check

      - name: Refuse a tag that disagrees with package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            echo "Publishing here would ship a version with no CHANGELOG entry."
            exit 1
          fi
          echo "tag and package.json agree on $PKG"

      - name: Refuse a version already on npm
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "@supersuit/suggest-a-change@$PKG" version >/dev/null 2>&1; then
            echo "$PKG is already published. Bump the version."
            exit 1
          fi
          echo "$PKG is not on npm yet"

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        # No NODE_AUTH_TOKEN and no .npmrc auth line, which is enforced by the absence of
        # `registry-url` above rather than by anything here. The OIDC identity is the entire
        # credential; ANY configured token takes precedence over it and puts the 2FA prompt
        # back, or fails as an unexplained 404.
        #
        # The assertion below catches the regression directly, because the symptom is otherwise
        # indistinguishable from a missing package.
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || grep -qs "_authToken" "${NPM_CONFIG_USERCONFIG:-/dev/null}"; then
            echo "A credential is configured, so npm will not attempt the OIDC exchange."
            echo "Check that setup-node above does not set registry-url."
            exit 1
          fi
          npm publish

      - name: Dry run only
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo "All checks passed. Nothing published (dry run)."
