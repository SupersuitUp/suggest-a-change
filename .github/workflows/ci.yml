name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # Typecheck, client tests, build, the node tests (which check the built tree), and the command.
      - run: npm run check
      # The package must run the way the README says, from outside the repo.
      - run: |
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/bin/suggest-a-change.mjs" --help
          node "$GITHUB_WORKSPACE/bin/check.mjs" --help
